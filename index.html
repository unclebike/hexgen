<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#18181A">
  <link rel="manifest" href="manifest.json">
  <title>Dialhex</title>
  <link rel="preload" href="skins.json" as="fetch" crossorigin>
  <link rel="preload" href="fonts/DialhexArchivoExpanded-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/DialhexArchivoExpanded-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/DialhexJetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #18181A;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #18181A;
      color: #F2EEE6;
      font-family: system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    #loading span {
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="loading"><span>loading</span></div>
  <canvas id="gameCanvas"></canvas>
  <script type="module">
    import './main.js';
    // main.js waits for skins.json and the fonts, so this runs once they're ready
    document.getElementById('loading').classList.add('hidden');
    setTimeout(() => document.getElementById('loading').remove(), 300);
  </script>
</body>
</html>
