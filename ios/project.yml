# XcodeGen spec — run `xcodegen` in this directory to create Dialhex.xcodeproj
name: Dialhex
options:
  bundleIdPrefix: xyz.unclebike
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  DialhexCore:
    path: DialhexCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dialhex:
    type: application
    platform: iOS
    sources:
      - path: Dialhex
        excludes:
          - GameCenterResources.gamekit
      # Leaderboards for Game Center, edited in Xcode's GameKit editor. Listed as one
      # file: as part of the folder above xcodegen would add the JSON inside it loose
      - path: Dialhex/GameCenterResources.gamekit
        type: file
        buildPhase: resources
      # Brand tokens and fonts, shared with the web game at the repo root
      - path: ../skins.json
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes:
          - "*.ttf"
          - "OFL-*.txt"
    scheme: {}
    dependencies:
      - package: DialhexCore
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: GameKit.framework
    entitlements:
      path: Dialhex/Dialhex.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Dialhex/Info.plist
      properties:
        CFBundleDisplayName: Hexgen
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Phone-as-controller: find an Apple TV running Hexgen on the local network
        NSLocalNetworkUsageDescription: Hexgen looks for an Apple TV on your network so you can use this phone as a controller.
        NSBonjourServices:
          - _dialhex._tcp
        # Game controllers: declare the extended profile and opt into Game Mode
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.unclebike.dialhex
        DEVELOPMENT_TEAM: 5C2GM29P79 # adam Tilley (Individual); kept here so `xcodegen` doesn't drop it
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Apple TV: the same app and bundle ID (so it can ship as a universal purchase),
  # started from DialhexTV/ so the remote and gamepads go straight to the game
  DialhexTV:
    type: application
    platform: tvOS
    sources:
      - path: Dialhex
        excludes:
          - Info.plist
          - Dialhex.entitlements
          - GameCenterResources.gamekit
      - path: Dialhex/GameCenterResources.gamekit
        type: file
        buildPhase: resources
      - path: DialhexTV
      - path: ../skins.json
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes:
          - "*.ttf"
          - "OFL-*.txt"
    scheme: {}
    dependencies:
      - package: DialhexCore
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: GameKit.framework
    entitlements:
      path: DialhexTV/DialhexTV.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: DialhexTV/Info.plist
      properties:
        CFBundleDisplayName: Hexgen
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).TVSceneDelegate
        # The Siri Remote (both generations) plays as well as gamepads; keep the
        # physical remote and the iPhone's Control Center remote apart
        GCSupportsControllerUserInteraction: true
        GCSupportsMultipleMicroGamepads: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
          - ProfileName: DirectionalGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.unclebike.dialhex
        DEVELOPMENT_TEAM: 5C2GM29P79
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        # Layered icon and Top Shelf images, rendered by `Icon/render.sh tv`
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
