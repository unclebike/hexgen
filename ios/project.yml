# XcodeGen spec — run `xcodegen` in this directory to create Dialhex.xcodeproj
name: Dialhex
options:
  bundleIdPrefix: xyz.unclebike
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DialhexCore:
    path: DialhexCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dialhex:
    type: application
    platform: iOS
    sources:
      - path: Dialhex
    scheme: {}
    dependencies:
      - package: DialhexCore
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
    info:
      path: Dialhex/Info.plist
      properties:
        CFBundleDisplayName: Dialhex
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # Game controllers: declare the extended profile and opt into Game Mode
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.unclebike.dialhex
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
